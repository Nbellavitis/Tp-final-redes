---
- name: Wait until expected workers are Ready in Kubernetes
  ansible.builtin.command: "/usr/local/bin/kubectl wait --for=condition=Ready node/{{ item }} --timeout=180s"
  changed_when: false
  loop: "{{ k3s_validation_nodes }}"

- name: Show full K3s node status
  ansible.builtin.command: /usr/local/bin/kubectl get nodes -o wide
  register: k3s_cluster_validation_status
  changed_when: false

- name: Print full K3s node status
  ansible.builtin.debug:
    var: k3s_cluster_validation_status.stdout_lines
