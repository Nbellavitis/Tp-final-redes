---
all:
  children:
    control_plane:
      hosts:
        k3s-control:
          ansible_host: "{{ lookup('env', 'NAT_SSH_HOST') | default('127.0.0.1', true) }}"
          ansible_port: 2222
          k3s_node_ip: 192.168.56.10
    workers:
      hosts:
        k3s-worker-1:
          ansible_host: "{{ lookup('env', 'NAT_SSH_HOST') | default('127.0.0.1', true) }}"
          ansible_port: 2200
          k3s_node_ip: 192.168.56.11
        k3s-worker-2:
          ansible_host: "{{ lookup('env', 'NAT_SSH_HOST') | default('127.0.0.1', true) }}"
          ansible_port: 2201
          k3s_node_ip: 192.168.56.12
    # Worker bajo demanda: apagado por defecto y fuera de k3s_cluster para que el
    # flujo base no falle si esta apagado. Se suma solo con add-worker.yml.
    ondemand_workers:
      hosts:
        k3s-worker-3:
          ansible_host: "{{ lookup('env', 'NAT_SSH_HOST') | default('127.0.0.1', true) }}"
          ansible_port: 2202
          k3s_node_ip: 192.168.56.13
    k3s_cluster:
      children:
        control_plane:
        workers:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/tpe-redes/{{ inventory_hostname }}_private_key"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
