---
- name: Refresh Control Plane facts required for worker joins
  hosts: control_plane
  become: true
  tags:
    - k3s_server
    - k3s_agent
    - k3s_validation
  roles:
    - k3s_server

- name: Configure and join additional K3s workers
  hosts: "{{ add_worker_target | default('workers') }}"
  become: true
  tags:
    - common
    - k3s_agent
  roles:
    - common
    - k3s_agent

- name: Validate K3s cluster after adding workers
  hosts: control_plane
  become: true
  tags:
    - k3s_validation
    - k3s_agent
  roles:
    - k3s_cluster_validation

- name: Export kubeconfig after worker changes
  hosts: control_plane
  become: true
  tags:
    - kubeconfig
  roles:
    - k3s_kubeconfig

- name: Optionally import The Store images on added workers
  hosts: "{{ add_worker_target | default('workers') }}"
  become: true
  tags:
    - images
    - the_store_images
  roles:
    - role: the_store_images
      when: import_store_images | default(false) | bool
