---
all:
  children:
    control_plane:
      hosts:
        k3s-control:
          ansible_host: 192.168.56.10
          k3s_node_ip: 192.168.56.10
    workers:
      hosts:
        k3s-worker-1:
          ansible_host: 192.168.56.11
          k3s_node_ip: 192.168.56.11
        k3s-worker-2:
          ansible_host: 192.168.56.12
          k3s_node_ip: 192.168.56.12
    # Worker bajo demanda: apagado por defecto (autostart: false en el Vagrantfile) y
    # deliberadamente FUERA de k3s_cluster, para que el flujo base (site.yml /
    # deploy-store.yml) no falle ni reporte "unreachable" cuando esta apagado.
    # Se incorpora solo en la demo de escalado con add-worker.yml.
    ondemand_workers:
      hosts:
        k3s-worker-3:
          ansible_host: 192.168.56.13
          k3s_node_ip: 192.168.56.13
    k3s_cluster:
      children:
        control_plane:
        workers:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../../.vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key"
    ansible_python_interpreter: /usr/bin/python3
