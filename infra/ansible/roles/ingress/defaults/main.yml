---
ingress_nginx_version: controller-v1.13.1
ingress_nginx_namespace: ingress-nginx
ingress_nginx_controller_name: ingress-nginx-controller
ingress_nginx_class_name: nginx
ingress_nginx_wait_timeout: 300s
ingress_nginx_manifest_url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/{{ ingress_nginx_version }}/deploy/static/provider/baremetal/deploy.yaml"
ingress_nginx_controller_selector: "app.kubernetes.io/component=controller,app.kubernetes.io/name=ingress-nginx"
ingress_nginx_node_hostname: "{{ inventory_hostname }}"
